name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Make sure Android platform 36 is installed
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create signing key
        run: |
          keytool -genkeypair -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" -storepass offscroll-ci -keypass offscroll-ci -alias upload -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=App Builder,O=Builder,C=US"
          echo "STORE_PASSWORD=offscroll-ci" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=offscroll-ci" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: dist/app-debug.apk
          if-no-files-found: error

      - name: Publish to Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          make_latest: "true"
          files: |
            dist/app-debug.apk
            dist/app-release.apk
          body: "Install app-debug.apk on your Android phone."
